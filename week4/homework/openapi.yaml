openapi: 3.0.3
info:
  title: Tasks API
  version: 1.0.0
  description: API tra cứu một task theo ID.
  contact:
    name: Tasks API maintainers
    email: api@example.com
servers:
  - url: http://localhost:5000/v1
    description: Local development server
tags:
  - name: tasks
    description: Tra cứu task
security:
  - bearerAuth: []
paths:
  /tasks/{taskId}:
    parameters:
      - $ref: '#/components/parameters/TaskId'
    get:
      tags: [tasks]
      operationId: getTaskById
      summary: Lấy task theo ID
      description: Trả về task tương ứng với UUID được cung cấp.
      responses:
        '200':
          description: Task được yêu cầu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TaskId:
      name: taskId
      in: path
      required: true
      description: UUID của task
      schema:
        type: string
        format: uuid
  schemas:
    Task:
      type: object
      required: [id, title, status, priority, createdAt]
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        title:
          type: string
          minLength: 1
          maxLength: 200
          example: Hoàn thành thiết kế API
        status:
          type: string
          enum: [todo, in_progress, done]
          example: in_progress
        priority:
          type: string
          enum: [low, medium, high]
          example: medium
        dueDate:
          type: string
          format: date
          nullable: true
          example: '2026-11-15'
        assigneeId:
          type: string
          format: uuid
          nullable: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          example: not_found
        message:
          type: string
          example: Task not found
  responses:
    Unauthorized:
      description: Thiếu bearer token
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    NotFound:
      description: ID không hợp lệ hoặc không tìm thấy task
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
